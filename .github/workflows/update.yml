name: Post Trading Economics calendar events

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-economics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_1STAR: ${{ secrets.DISCORD_CHANNEL_1STAR }}
          DISCORD_CHANNEL_2STAR: ${{ secrets.DISCORD_CHANNEL_2STAR }}
          DISCORD_CHANNEL_3STAR: ${{ secrets.DISCORD_CHANNEL_3STAR }}
        run: python src/main.py

      - name: Commit state.json if changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update dedup state"
            git push
          fi
